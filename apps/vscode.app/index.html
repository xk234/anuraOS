<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VS Code Workbench</title>
<link rel="stylesheet" href="/assets/materialsymbols.css">
<style>
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#1e1e1e;color:#ccc;font:13px "Segoe UI",Arial,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:36px 1fr 22px}
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:#181818;border-bottom:1px solid #333}
#brand{font-weight:600;color:#ddd;margin-right:auto}button{border:0;background:#333;color:#ddd;padding:6px 10px;cursor:pointer;border-radius:3px}button:hover{background:#454545}
#side{grid-row:2;background:#252526;border-right:1px solid #333;overflow:auto;padding:10px 0}
#side h3{font-size:11px;letter-spacing:1px;font-weight:600;padding:0 14px;color:#bbb}
.tree-item{display:block;width:100%;text-align:left;background:transparent;padding:5px 12px;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-item:hover,.tree-item.active{background:#37373d}
#main{grid-row:2;grid-column:2;display:grid;grid-template-rows:34px 1fr;min-width:0;min-height:0}
#tabs{background:#252526;display:flex;align-items:stretch;border-bottom:1px solid #333}
#tab{padding:8px 14px;background:#1e1e1e;border-right:1px solid #333;color:#eee}
#editor{width:100%;height:100%;min-height:0}
#status{grid-column:1/3;background:#007acc;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}
#empty{padding:24px;color:#888}
</style>
<script src="/libs/monaco-editor/min/vs/loader.js"></script>
</head>
<body><div id="app">
<header id="top"><span id="brand">◈ VS Code Workbench</span><button id="new">New File</button><button id="save">Save</button></header>
<aside id="side"><h3>EXPLORER — WORKSPACE</h3><div id="tree"></div></aside>
<main id="main"><div id="tabs"><div id="tab">Welcome</div></div><div id="editor"><div id="empty">Loading editor…</div></div></main>
<footer id="status"><span id="status-left">AnuraOS · Local workspace</span><span id="status-right">Ready</span></footer>
</div><script type="module" src="index.mjs"></script></body></html>
